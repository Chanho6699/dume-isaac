[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dume-isaac"
version = "0.1.0"
description = "Isaac Sim / Isaac Lab simulation and learning experiments for the Brain Us SO-101 follower"
readme = "README.md"
requires-python = ">=3.11"
# Isaac Sim / Isaac Lab / PyTorch are intentionally NOT listed: they come from the
# local Isaac installation (target: Isaac Sim 5.1.0 / Isaac Lab v2.3.2 / Python 3.11,
# see docs/environment.md). Never pip-install them through this project.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]

[tool.setuptools.packages.find]
include = ["dume_isaac*"]

[tool.setuptools.package-data]
"dume_isaac.assets" = ["**/*.yaml", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
